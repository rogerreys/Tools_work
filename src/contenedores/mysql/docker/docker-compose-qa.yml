version: '3.8'

services:
  mysql-qa03:
    image: 462297762050.dkr.ecr.us-east-1.amazonaws.com/reingesta-repository-qa:upload-latest
    container_name: cobis-qa03-local
    restart: always
    ports:
      - "3333:3306"
    volumes:
      - mysql-qa-data:/var/lib/mysql
    environment:
      TZ: America/Bogota
      pEnvironment: "qa03"
    networks:
      - cobis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql-qa-data:
    driver: local

networks:
  cobis-network:
    driver: bridge